<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>现场演示 · Credential Verification Portal</title>
<link rel="stylesheet" href="/static/css/showtime.css">
</head>
<body>
<main class="stage">
  <header class="head">
    <div>
      <div class="kicker">GEF26 · Live demo</div>
      <h1 class="title">一张证书，四个步骤</h1>
    </div>
    <div class="meter" id="meter">链上 <b id="height">—</b> 块 · 签发方 <b id="signers">—</b></div>
  </header>

  <section class="steps" id="steps">
    <div class="step" data-step="1"><div class="n">01</div><div class="what">机构签发一张证书</div><div class="meta"></div></div>
    <div class="step" data-step="2"><div class="n">02</div><div class="what">任何人拿验证码去验</div><div class="meta"></div></div>
    <div class="step" data-step="3"><div class="n">03</div><div class="what">机构把它注销</div><div class="meta"></div></div>
    <div class="step" data-step="4"><div class="n">04</div><div class="what">再验同一张</div><div class="meta"></div></div>
  </section>

  <section class="board" id="board">
    <p class="wait" id="headline">按左下角「开始」，四步走完大约 12 秒。</p>
    <p class="sub" id="subline">每一步都是真实的 API 调用：真的签发、真的上链、真的注销。不是动画。</p>
    <div class="hash" id="hashline" hidden></div>
    <div class="qrwrap" id="qrwrap" hidden></div>
  </section>

  <footer class="foot">
    <button class="go" id="startBtn" type="button">开始</button>
    <button class="quiet" id="resetBtn" type="button" hidden>重来</button>
    <input class="token" id="tokenInput" type="password" placeholder="机构口令（仅在无会话时需要）" hidden>
    <p class="hint" id="hint" hidden>扫屏幕上的二维码，用你自己的手机验这张证书。</p>
    <p class="note" id="note" hidden></p>
  </footer>
</main>
<script src="/static/js/showtime.js"></script>
</body>
</html>

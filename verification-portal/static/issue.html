<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簽發證書 · Credential Verification Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a16207'/%3E%3Cpath d='M9 22V10h9a4 4 0 0 1 0 8h-4v4zm4-7h4a1.5 1.5 0 0 0 0-3h-4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/simple.css">
</head>
<body>
<main class="card">
  <header class="top">
    <a class="brand" href="/">Credential Verification Portal</a>
    <nav class="topnav">
      <a href="/">驗證</a>
      <a class="on" href="/issue">簽發</a>
      <a href="/showtime">現場演示</a>
    </nav>
  </header>
  <h1>開一張證書</h1>
  <p class="lede">填三格，籤一下就上鍊。簽完立刻能在驗證頁查到。</p>

  <form id="issueForm" autocomplete="off">
    <label class="field" for="nameInput">
      <span>姓名</span>
      <input type="text" id="nameInput" placeholder="例如 CHAN TAI MAN" required>
    </label>
    <label class="field" for="sidInput">
      <span>學號</span>
      <input type="text" id="sidInput" placeholder="例如 22000001" required>
    </label>
    <label class="field" for="degreeInput">
      <span>學位 / 課程</span>
      <input type="text" id="degreeInput" placeholder="例如 Bachelor of Engineering" required>
    </label>

    <details class="why">
      <summary>補充信息（可選）</summary>
      <label class="field" for="honourInput">
        <span>榮譽</span>
        <input type="text" id="honourInput" placeholder="例如 1ST HON">
      </label>
      <label class="field" for="issuerInput">
        <span>簽發機構</span>
        <input type="text" id="issuerInput" placeholder="預設 UNIVERSITY OF UTOPIA">
      </label>
      <label class="field" for="dateInput">
        <span>簽發日期</span>
        <input type="text" id="dateInput" placeholder="例如 20261121">
      </label>
    </details>

    <details class="why" id="tokenBlock" hidden>
      <summary>機構口令</summary>
      <label class="field" for="tokenInput">
        <span>口令（只存在這台瀏覽器裡）</span>
        <input type="password" id="tokenInput" placeholder="向管理員索取">
      </label>
      <p class="hint" id="tokenHint">簽發需要機構權限。已登錄控制枱的話這一項會自動隱藏。</p>
    </details>

    <button type="submit" class="primary" id="issueBtn">簽發並上鏈</button>
    <p class="note" id="error" hidden></p>
  </form>

  <section class="result" id="result" hidden></section>

  <footer>
    你有證書要驗？<a href="/">去驗證頁</a> · 想看完整控制枱（批量簽發、簽名方、公開日誌）：<a href="/portal">詳細版</a>
    <div class="hint">每籤一張，鏈上就多一條記錄；記錄只追加，不能刪。</div>
  </footer>
</main>
<script src="/static/js/simple_issue.js"></script>
</body>
</html>

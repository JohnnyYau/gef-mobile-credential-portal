<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凭证验证 · Credential Verification Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M9 22V10h9a4 4 0 0 1 0 8h-4v4zm4-7h4a1.5 1.5 0 0 0 0-3h-4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/simple.css">
</head>
<body>
<main class="card">
  <a class="brand" href="/portal">Credential Verification Portal</a>
  <h1>这张证书是真的吗？</h1>
  <p class="lede">粘贴验证码，或者上传证书 PDF。三秒出结果，不用注册。</p>

  <form id="verifyForm" autocomplete="off">
    <label class="field" for="hashInput">
      <span>验证码</span>
      <textarea id="hashInput" rows="2" placeholder="例如 GFiY4d67…（约 80 个字符）"></textarea>
    </label>
    <div class="or">或</div>
    <label class="file" id="fileBox">
      <input type="file" id="fileInput" accept="application/pdf,application/json,image/*">
      <span id="fileLabel">选择证书文件（PDF / JSON）</span>
    </label>
    <button type="submit" class="primary" id="verifyBtn">验证</button>
    <p class="note" id="error" hidden></p>
  </form>

  <section class="result" id="result" hidden></section>

  <section class="samples" id="samples" hidden>
    <p>没带证书？先点一个试试：</p>
    <div class="chips" id="chips"></div>
  </section>

  <footer>
    你是签发方？<a href="/issue">去开一张证书</a><br>
    需要六个检查项、批量验证、公开日志：<a href="/portal">详细版</a>
    <div class="hint">这一页只做验证，不会保存你上传的文件。</div>
  </footer>
</main>
<script src="/static/js/simple_verify.js"></script>
</body>
</html>

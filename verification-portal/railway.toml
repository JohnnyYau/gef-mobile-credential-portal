# Railway config — Week 3 deployment alternative (public verifier mode).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers"

# Deploy-time variables (set in the Railway dashboard):
#   PUBLIC_MODE=1            — public verifier: no admin endpoints, no admin UI
#   PUBLIC_BASE_URL=https://<your-app>.up.railway.app
# Free-tier persistence mirrors Render: no volume on free plans. Either
#   CHAIN_SNAPSHOT_URL=<url of a backup_chain.py export>
# (restored on boot when the chain dir is empty), or a paid volume at /data
# with CHAIN_DIR=/data/demo-chain.
